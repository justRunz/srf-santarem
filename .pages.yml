# Pages CMS config (app.pagescms.org): what the site owner can edit without code.
# Field names (name:) are English code identifiers; labels stay in Portuguese for the editor.
media:
  input: public/img
  output: /img

components:
  hero:
    label: Topo da página
    type: object
    fields:
      - { name: eyebrow, label: Pequeno texto acima do título, type: string }
      - { name: title, label: Título (uma linha por item), type: string, list: true }
      - { name: text, label: Texto, type: text }
  kit:
    label: Carrossel do kit
    type: object
    fields:
      - { name: title, label: Título (uma linha por item), type: string, list: true }
      - name: items
        label: Fotos
        type: object
        list: true
        fields:
          - { name: title, label: Nome, type: string }
          - { name: photo, label: Foto, type: image }
  packages:
    label: Pacotes (2 cartões; a duração é fixa)
    type: object
    fields:
      - { name: title, label: Título (uma linha por item), type: string, list: true }
      - name: items
        label: Cartões
        type: object
        list:
          min: 2
          max: 2
        fields:
          - { name: name, label: Nome, type: string }
          - { name: text, label: Texto, type: text }
  highlight:
    label: Faixa escura
    type: object
    fields:
      - { name: eyebrow, label: Pequeno texto acima do título, type: string }
      - { name: title, label: Título (uma linha por item), type: string, list: true }
      - { name: text, label: Texto, type: text }

content:
  - name: site
    label: Informações gerais
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Nome completo, type: string }
      - { name: acronym, label: Sigla (menu e rodapé), type: string }
      - { name: description, label: Descrição para o Google, type: text }
      - { name: phone, label: Telefone, type: string }
      - { name: whatsapp, label: "Número WhatsApp (só algarismos, com 351)", type: string }
      - { name: whatsappMessage, label: Mensagem pré-escrita do WhatsApp, type: string }
      - { name: email, label: Email, type: string }
      - { name: address, label: Morada, type: string }
      - { name: postalCode, label: Código postal e cidade, type: string }
      - { name: hours, label: Horário (uma linha por item), type: string, list: true }
      - { name: footer, label: Texto do rodapé (uma linha por item), type: string, list: true }

  - name: pricing
    label: Preços e Entregas
    type: file
    path: src/data/pricing.json
    format: json
    fields:
      - name: rates
        label: Tarifas (em €, usadas em todo o site)
        type: object
        fields:
          - { name: fifteenDays, label: Aluguer mínimo 15 dias, type: number }
          - { name: extraDay, label: Dia extra (a partir do 16.º dia), type: number }
          - { name: month, label: Mês completo (30 dias), type: number }
          - { name: deposit, label: Caução, type: number }
      - { name: hero, component: hero }
      - name: groups
        label: Tabelas
        type: object
        list: true
        fields:
          - { name: title, label: Título, type: string }
          - name: rows
            label: Linhas
            type: object
            list: true
            fields:
              - { name: name, label: Nome, type: string }
              - { name: value, label: Valor, type: string }
      - { name: depositTerms, label: Condições da caução, type: string }
      - name: highlight
        label: Faixa escura
        type: object
        fields:
          - { name: title, label: Título (uma linha por item), type: string, list: true }
          - { name: text, label: Texto, type: text }

  - name: home
    label: Página Início
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: hero
        label: Topo da página
        type: object
        fields:
          - { name: eyebrow, label: Pequeno texto acima do título, type: string }
          - { name: title, label: Título (uma linha por item), type: string, list: true }
          - { name: text, label: Texto, type: text }
      - { name: intro, component: hero, label: Introdução }
      - name: points
        label: Blocos
        type: object
        list: true
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
      - { name: kit, component: kit }
      - { name: packages, component: packages }
      - name: steps
        label: Como funciona
        type: object
        fields:
          - { name: eyebrow, label: Pequeno texto, type: string }
          - name: items
            label: Passos
            type: object
            list: true
            fields:
              - { name: title, label: Título, type: string }
              - { name: text, label: Texto, type: text }
      - name: about
        label: Quem somos (faixa escura)
        type: object
        fields:
          - { name: eyebrow, label: Pequeno texto acima do título, type: string }
          - { name: title, label: Título (uma linha por item), type: string, list: true }
          - { name: texts, label: Parágrafos, type: text, list: true }

  - name: benefits
    label: Página Benefícios
    type: file
    path: src/data/benefits.json
    format: json
    fields:
      - { name: hero, component: hero }
      - name: points
        label: Blocos
        type: object
        list: true
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
      - { name: highlight, component: highlight }

  - name: equipment
    label: Página Equipamentos
    type: file
    path: src/data/equipment.json
    format: json
    fields:
      - { name: hero, component: hero }
      - { name: kit, component: kit }
      - name: points
        label: Blocos
        type: object
        list: true
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
      - name: howItWorks
        label: Como funciona (3 vídeos)
        type: object
        fields:
          - { name: title, label: Título (uma linha por item), type: string, list: true }
          - name: items
            label: Passos
            type: object
            list: { min: 3, max: 3 }
            fields:
              - { name: title, label: Título, type: string }
              - { name: text, label: Texto, type: text }
              - { name: video, label: "Vídeo (caminho, ex.: /video/passo-gelo.mp4)", type: string }
      - { name: packages, component: packages }
      - { name: highlight, component: highlight }

  - name: contact
    label: Página Contactos
    type: file
    path: src/data/contact.json
    format: json
    fields:
      - { name: hero, component: hero }
      - { name: area, label: Área de serviço, type: text }
